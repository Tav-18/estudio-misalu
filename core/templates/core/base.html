{% load static %}
<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Estudio de Danza Misalú: clases de danza urbana, contemporánea y K-pop.">
    <meta name="theme-color" content="#090615">
    <title>{% block title %}Estudio de Danza Misalú{% endblock %}</title>
    <link rel="icon" type="image/png" href="{% static 'core/img/logo-misalu.png' %}">
    <link rel="stylesheet" href="{% static 'core/css/styles.css' %}">
    <script defer src="{% static 'core/js/main.js' %}"></script>
    <script defer src="{% static 'core/js/chatbot.js' %}"></script>
    <script defer src="{% static 'core/js/social.js' %}"></script>
</head>
<body>
    <a class="skip-link" href="#contenido">Saltar al contenido</a>
    {% block content %}{% endblock %}

</html>
